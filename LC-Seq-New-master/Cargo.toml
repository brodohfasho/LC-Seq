[package]
name = "lcseq"
version = "0.1.0"
edition = "2021"

[lib]
name = "lcseq"
crate-type = ["cdylib", "rlib"]

[dependencies]
petgraph = "0.6"
rayon = "1"
statrs = "0.17"
pyo3 = { version = "0.22", optional = true }
numpy = { version = "0.22", optional = true }

[features]
default = []
extension-module = ["dep:pyo3", "dep:numpy", "pyo3/extension-module"]

[dev-dependencies]
serde_json = "1"
